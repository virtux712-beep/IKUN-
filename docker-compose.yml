services:
  ikun-home:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ikun-home
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s