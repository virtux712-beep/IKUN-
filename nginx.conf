server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---------------------------------------------------------------
    # 压缩
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------------------------------------------------------------
    # 安全响应头
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # ---------------------------------------------------------------
    # 带 hash 的静态资源：强缓存一年
    # ---------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # HTML 入口与其它文件：不缓存，保证发版后立刻生效
    # ---------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ---------------------------------------------------------------
    # SPA 回退
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件
    location ~ /\. {
        deny all;
    }
}